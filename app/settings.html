<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Voice Assistant — Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="settings-card">

  <!-- 頂部 -->
  <div class="head">
    <div class="head-left">
      <span class="head-ico">⚙</span>
      <span class="head-title">SETTINGS</span>
    </div>
    <button class="head-close" id="btnClose" title="關閉">×</button>
  </div>

  <div class="scroll-area">

    <!-- 區段 1：API 連線 -->
    <div class="section">
      <div class="section-title">API CONNECTION</div>

      <div class="field">
        <label>Provider</label>
        <div class="static-value">Claw Router</div>
      </div>

      <div class="field">
        <label>Base URL</label>
        <input type="text" id="baseUrl" value="https://clawrouter.com/v1">
      </div>

      <div class="field">
        <label>API Key <span class="hint">(sk-claw-...)</span></label>
        <div class="key-row">
          <input type="password" id="apiKey" placeholder="貼上你的 API Key" autocomplete="off">
          <button class="icon-btn" id="btnReveal" title="顯示 / 隱藏">👁</button>
        </div>
        <div class="key-status" id="keyStatus">尚未設定</div>
      </div>

      <div class="actions-row">
        <button class="btn-primary" id="btnSaveKey">儲存 Key</button>
        <button class="btn-secondary" id="btnTest">Test Connection</button>
        <button class="btn-danger" id="btnClearKey">清除 Key</button>
      </div>

      <div class="test-result" id="testResult"></div>
    </div>

    <!-- 區段 2：模型 -->
    <div class="section">
      <div class="section-title">MODEL</div>

      <div class="field">
        <label>預設模型</label>
        <select id="defaultModel">
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6（建議日常用）</option>
          <option value="claude-sonnet-4-5-20250929">Claude Sonnet 4.5</option>
          <option value="claude-opus-4-8">Claude Opus 4.8（最強）</option>
          <option value="claude-opus-4-6">Claude Opus 4.6（1M context）</option>
          <option value="gpt-5.5">GPT-5.5</option>
          <option value="gemini-3-pro-preview">Gemini 3 Pro</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash（便宜快速）</option>
        </select>
        <div class="hint">完整清單以 Claw Router 後台為準</div>
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="modelRouting" checked>
          <span>啟用模型自動路由（簡單任務丟便宜模型）</span>
        </label>
      </div>
    </div>

    <!-- 區段 3：語音 -->
    <div class="section">
      <div class="section-title">VOICE</div>

      <div class="field">
        <label>TTS 音色</label>
        <select id="ttsVoice">
          <option value="zh-TW-HsiaoChenNeural">HsiaoChen（繁中女聲）</option>
          <option value="zh-TW-HsiaoYuNeural">HsiaoYu（繁中女聲 · 較年輕）</option>
          <option value="zh-TW-YunJheNeural">YunJhe（繁中男聲）</option>
          <option value="zh-CN-XiaoxiaoNeural">Xiaoxiao（簡中女聲）</option>
          <option value="en-US-AriaNeural">Aria（英文女聲）</option>
        </select>
      </div>

      <div class="field">
        <label>說話速度 <span class="hint" id="rateValue">1.0×</span></label>
        <input type="range" id="ttsRate" min="0.5" max="1.5" step="0.05" value="1.0">
      </div>

      <div class="field">
        <label>Push-to-talk 熱鍵</label>
        <div class="static-value"><kbd>Ctrl</kbd> + <kbd>Space</kbd>（暫時不可改）</div>
      </div>
    </div>

    <!-- 區段 4：用量上限 -->
    <div class="section">
      <div class="section-title">SPENDING</div>

      <div class="field">
        <label>月額上限 (USD) <span class="hint">超過自動暫停</span></label>
        <input type="number" id="monthlyCap" value="50" min="0" step="5">
      </div>

      <div class="field-static">
        <div class="stat">
          <div class="stat-label">本月已用</div>
          <div class="stat-value">$0.00</div>
        </div>
        <div class="stat">
          <div class="stat-label">今日已用</div>
          <div class="stat-value">$0.00</div>
        </div>
      </div>
    </div>

    <!-- 區段 5：說明 -->
    <div class="section dim">
      <div class="section-title">HOW TO GET A KEY</div>
      <ol class="howto">
        <li>到 <span class="link">clawrouter.com</span> 註冊帳號</li>
        <li>儲值（建議先 USD 20 試水溫）</li>
        <li>建立一支 API Key（會是 <code>sk-claw-...</code> 開頭）</li>
        <li>複製整串貼進上方 API Key 欄位 → 按「儲存 Key」</li>
        <li>按「Test Connection」確認可以用</li>
      </ol>
    </div>

  </div>

  <!-- 底部 -->
  <div class="foot">
    <button class="btn-secondary" id="btnCloseFoot">關閉</button>
    <button class="btn-primary" id="btnSaveAll">儲存全部設定</button>
  </div>

</div>

<script src="settings.js"></script>
</body>
</html>
