<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Voice Assistant — Ops Center</title>
<link rel="stylesheet" href="fullscreen.css">
</head>
<body>

<!-- 頂部工具列 -->
<div class="topbar">
  <button class="topbar-btn" id="btnCollapse" title="收回浮窗 (ESC)">
    <span class="ico">←</span> <span class="lbl">FLOATING</span>
  </button>
  <div class="topbar-title">CLAUDE · OPS CENTER</div>
  <div class="topbar-actions">
    <button class="topbar-btn" id="btnSettings" title="設定">⚙ SETTINGS</button>
    <button class="topbar-btn close" id="btnClose" title="關閉">×</button>
  </div>
</div>

<!-- 中央 Orb 區 -->
<div class="hero-stage">
  <div class="big-orb-wrap">
    <div class="big-ring r1"></div>
    <div class="big-ring r2"></div>
    <div class="big-ring r3"></div>
    <div class="big-ring r4"></div>
    <div class="big-orb"></div>
  </div>
  <div class="big-status" id="statusText">THINKING</div>
  <div class="big-status-detail" id="statusDetail">Claude 正在處理你的請求</div>
</div>

<!-- 主內容區：左對話 / 右任務 -->
<div class="main-grid">

  <!-- 左：對話歷史 -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">CONVERSATION</span>
      <span class="panel-meta" id="convoMeta">—</span>
    </div>
    <div class="convo" id="convo">
      <div class="convo-empty" id="convoEmpty">尚無對話 — 按住麥克風說句話試試</div>
    </div>
  </div>

  <!-- 右：當前任務 -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">CURRENT TASK</span>
      <span class="panel-meta" id="taskStatus">IDLE</span>
    </div>
    <div class="task-current">
      <div class="task-label">CURRENTLY</div>
      <div class="task-body" id="taskBody">待命中</div>
    </div>

    <div class="task-steps" id="taskSteps">
      <div class="task-step pending"><span class="step-mark">○</span><span class="step-text">尚無動作</span></div>
    </div>

    <!-- 用到的工具 -->
    <div class="tools-row">
      <div class="tools-label">TOOLS USED</div>
      <div class="tools-list" id="toolsList"><span class="tool-chip dim">—</span></div>
    </div>

    <!-- 用量 -->
    <div class="usage-row">
      <div class="usage-item">
        <div class="usage-label">MODEL</div>
        <div class="usage-value" id="uModel">—</div>
      </div>
      <div class="usage-item">
        <div class="usage-label">TOKENS</div>
        <div class="usage-value" id="uTokens">—</div>
      </div>
      <div class="usage-item">
        <div class="usage-label">本月 COST</div>
        <div class="usage-value" id="uCost">$0.00</div>
      </div>
      <div class="usage-item">
        <div class="usage-label">ELAPSED</div>
        <div class="usage-value" id="uElapsed">—</div>
      </div>
    </div>
  </div>

</div>

<!-- 底部熱鍵提示列 -->
<div class="hotkey-bar">
  <div class="hotkey"><kbd>SPACE</kbd> 按住說話</div>
  <div class="hotkey"><kbd>ESC</kbd> 收回浮窗</div>
  <div class="hotkey"><kbd>Ctrl</kbd> + <kbd>K</kbd> 開設定</div>
  <div class="hotkey"><kbd>Ctrl</kbd> + <kbd>Q</kbd> 中斷任務</div>
</div>

<script src="fullscreen.js"></script>
</body>
</html>
